[project]
name = "codex-culinaria"
version = "0.1.0"
description = "Local-first culinary R&D vault and tooling."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
culinaria = "codex_culinaria.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
extend-exclude = ["vault", "data_examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
